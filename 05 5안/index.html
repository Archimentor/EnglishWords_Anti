  <nav class="portal-bar" aria-label="전체 학습기 메뉴" data-course="5"><a class="portal-home" href="../index.html"><span aria-hidden="true">←</span> 전체 메인메뉴</a><span class="portal-brand-name">ENGLISHWORDS</span><div class="portal-options"><a href="../02 2안/index.html">2안</a><a href="../03 3안/index.html">3안</a><a href="../04 4안/index.html">4안</a><a href="../05 5안/index.html" aria-current="page">5안</a></div></nav>

  <header class="site-header" id="site-header">
    <button class="brand" type="button" data-action="go-home" aria-label="Grammar Blueprint 오늘 학습으로 이동">
      <span class="brand-plate" aria-hidden="true">05</span>
      <span class="brand-copy"><b>GRAMMAR</b><strong>BLUEPRINT</strong></span>
    </button>

    <nav class="global-nav" aria-label="주요 메뉴">
      <button type="button" data-route="today" data-action="navigate">오늘 설계</button>
      <button type="button" data-route="course" data-action="navigate">40개 과정</button>
      <button type="button" data-route="review" data-action="navigate">복습 큐</button>
      <button type="button" data-route="records" data-action="navigate">학습 기록</button>
    </nav>

    <div class="header-tools">
      <span id="due-counter">복습 0</span>
      <button class="tool-button" type="button" data-action="open-settings" aria-label="학습 설정 열기">설정</button>
    </div>
  </header>

  <main id="workspace" tabindex="-1" aria-live="polite"></main>

  <dialog class="settings-dialog" id="settings-dialog">
    <form method="dialog" class="settings-panel">
      <header>
        <div><span>STUDIO SETTINGS</span><h2>학습 설정</h2></div>
        <button class="dialog-close" value="cancel" aria-label="설정 닫기">×</button>
      </header>

      <label class="setting-row">
        <span><b>하루 설계 시간</b><small>오늘 화면에 표시할 학습량을 조절합니다.</small></span>
        <select id="goal-minutes" data-setting="goalMinutes">
          <option value="10">10분</option>
          <option value="15">15분</option>
          <option value="25">25분</option>
        </select>
      </label>

      <label class="setting-row">
        <span><b>예문 소리 듣기</b><small>브라우저 음성으로 영어 예문을 읽습니다.</small></span>
        <input id="sound-enabled" type="checkbox" data-setting="soundEnabled">
      </label>

      <section class="settings-danger">
        <div><b>학습 기록 초기화</b><p>설계 진도, 숙련도, 복습 일정이 이 브라우저에서 삭제됩니다.</p></div>
        <button type="button" data-action="request-reset">초기화</button>
      </section>
    </form>
  </dialog>
