<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A1부터 C1까지 문법 개념을 교재처럼 상세히 이해하고 필요한 만큼 연습하는 영어 문법 학습기">
  <meta name="theme-color" content="#f2efe7">
  <title>Grammar Lab · A1–C1 문법 학습기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#app">학습 내용으로 건너뛰기</a>

  <header class="site-header" id="site-header">
    <button class="brand" type="button" data-action="go-today" aria-label="Grammar Lab 오늘 학습으로 이동">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>grammar<span>lab.</span></span>
    </button>

    <nav class="main-nav" aria-label="주요 메뉴">
      <button type="button" data-nav="today" data-action="nav">오늘 학습</button>
      <button type="button" data-nav="map" data-action="nav">문법 교재</button>
      <button type="button" data-nav="notebook" data-action="nav">학습 기록</button>
    </nav>

    <div class="header-status">
      <span id="due-status">복습 0</span>
      <button class="profile-button" type="button" data-action="open-settings" aria-label="학습 설정 열기">나</button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <dialog class="settings-dialog" id="settings-dialog">
    <form method="dialog" class="settings-sheet">
      <header>
        <div>
          <p class="micro-label">LAB SETTINGS</p>
          <h2>학습 설정</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="설정 닫기">×</button>
      </header>

      <label class="setting-row">
        <span><strong>하루 학습 시간</strong><small>오늘의 문법 주제 수가 자동 조절됩니다.</small></span>
        <select id="goal-minutes" data-setting="goalMinutes">
          <option value="5">5분</option>
          <option value="10">10분</option>
          <option value="15">15분</option>
        </select>
      </label>

      <label class="setting-row">
        <span><strong>정답 문장 읽기</strong><small>브라우저 음성으로 정답을 들려줍니다.</small></span>
        <input id="sound-enabled" type="checkbox" data-setting="soundEnabled">
      </label>

      <div class="settings-danger">
        <strong>학습 기록 초기화</strong>
        <p>진단, 숙련도, 복습 일정이 이 브라우저에서 삭제됩니다.</p>
        <button type="button" data-action="request-reset">초기화</button>
      </div>
    </form>
  </dialog>

  <script src="./data/grammar-curriculum.js"></script>
  <script src="./data/grammar-lessons-a1.js"></script>
  <script src="./learning-engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
