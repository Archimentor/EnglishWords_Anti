<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="기초부터 고등학교까지 이어지는 영단어 학습기 2안과 3안을 직접 비교합니다.">
  <title>EnglishWords · 2안과 3안</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e8;
      --ink: #171918;
      --muted: #6f726d;
      --line: rgba(23, 25, 24, 0.18);
      --accent: #f05232;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--paper);
      background-size: 48px 48px;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    a { color: inherit; }

    .shell {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 0 clamp(20px, 4vw, 64px);
      border-bottom: 1px solid var(--ink);
      background: rgba(244, 240, 232, 0.94);
    }

    .brand {
      margin: 0;
      font: 700 clamp(18px, 2vw, 25px)/1 Georgia, serif;
      letter-spacing: -0.04em;
    }

    .brand span { color: var(--accent); }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100svh - 72px);
    }

    .option {
      position: relative;
      min-width: 0;
      padding: clamp(32px, 6vw, 88px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      text-decoration: none;
      isolation: isolate;
      animation: arrive 650ms both cubic-bezier(.2,.7,.2,1);
    }

    .option + .option {
      border-left: 1px solid var(--ink);
      animation-delay: 110ms;
    }

    .option::before {
      content: attr(data-number);
      position: absolute;
      right: -0.02em;
      bottom: -0.2em;
      z-index: -1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(23, 25, 24, 0.22);
      font: 700 clamp(220px, 34vw, 560px)/0.75 Georgia, serif;
      transition: transform 450ms cubic-bezier(.2,.7,.2,1), color 300ms ease;
    }

    .option:hover::before,
    .option:focus-visible::before {
      color: rgba(240, 82, 50, 0.08);
      transform: translate3d(-12px, -8px, 0);
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h2 {
      max-width: 8ch;
      margin: 0;
      font: 500 clamp(42px, 6vw, 92px)/0.98 Georgia, "Noto Serif KR", serif;
      letter-spacing: -0.07em;
      text-wrap: balance;
    }

    .summary {
      max-width: 38ch;
      margin: clamp(32px, 6vh, 72px) 0 0;
      color: var(--muted);
      font-size: clamp(14px, 1.25vw, 17px);
      line-height: 1.75;
    }

    .enter {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 36px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .enter::after {
      content: "→";
      color: var(--accent);
      font-size: 20px;
      transition: transform 220ms ease;
    }

    .option:hover .enter::after,
    .option:focus-visible .enter::after { transform: translateX(8px); }

    .option:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      header { min-height: 62px; }
      header p { display: none; }
      main { grid-template-columns: 1fr; min-height: calc(100svh - 62px); }
      .option { min-height: calc((100svh - 62px) / 2); padding: 28px 22px; }
      .option + .option { border-top: 1px solid var(--ink); border-left: 0; }
      .option::before { font-size: clamp(190px, 54vw, 260px); }
      .eyebrow { margin-bottom: 12px; }
      h2 { max-width: 12ch; font-size: clamp(34px, 10vw, 54px); }
      .summary { margin-top: 18px; font-size: 13px; line-height: 1.55; }
      .enter { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <p class="brand">EnglishWords<span>.</span></p>
      <p>Learning system comparison</p>
    </header>
    <main>
      <a class="option" data-number="2" href="./02%202%EC%95%88/" aria-label="영단어 학습기 2안 실행">
        <div>
          <p class="eyebrow">OPTION 02 · SESSION</p>
          <h2>단계별 세션 학습</h2>
          <p class="summary">정해진 학습 흐름을 따라 새 단어와 복습을 차례로 진행하는 구성입니다.</p>
        </div>
        <span class="enter">2안 실행</span>
      </a>

      <a class="option" data-number="3" href="./03%203%EC%95%88/" aria-label="영단어 학습기 3안 실행">
        <div>
          <p class="eyebrow">OPTION 03 · WORD RADAR</p>
          <h2>빈틈 탐색형 학습</h2>
          <p class="summary">여러 단어를 훑어 모르는 것만 골라내고, 실제 회상 결과로 복습을 자동 배정합니다.</p>
        </div>
        <span class="enter">3안 실행</span>
      </a>
    </main>
  </div>
</body>
</html>
